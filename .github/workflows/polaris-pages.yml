name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: english-grammar-trainer-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 統合前は3アプリ分の config を別々に生成していた。いまは1つ。
      - name: Generate runtime config
        run: node scripts/write-config.mjs
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 単一アプリになったため、リポジトリ直下をそのまま配信する。
      # 統合前は ポラリス配下をルートへ展開し、他2アプリをサブディレクトリへコピーしていた。
      - name: Prepare static files
        run: |
          mkdir -p _site
          cp index.html admin.html robots.txt config.json _site/
          cp -r shared _site/shared
          cp -r modules _site/modules
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
